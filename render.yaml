databases:
  - name: crm-cervejeiros-db
    databaseName: crm_cervejeiros
    user: crm_cervejeiros

services:
  - type: web
    name: crm-cervejeiros
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@cervejeiros.com.br
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: DATABASE_URL
        fromDatabase:
          name: crm-cervejeiros-db
          property: connectionString

  - type: web
    name: financeiro-cervejeiros
    runtime: python
    rootDir: financeiro
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn financeiro_app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FINANCE_SECRET_KEY
        generateValue: true
      - key: FINANCE_ADMIN_EMAIL
        value: financeiro@cervejeiros.com.br
      - key: FINANCE_ADMIN_PASSWORD
        value: "1234"
      - key: DATABASE_URL
        fromDatabase:
          name: crm-cervejeiros-db
          property: connectionString
