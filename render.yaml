services:
  - type: web
    name: crm-cervejeiros
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@cervejeiros.com.br
      - key: ADMIN_PASSWORD
        value: "1234"
      - key: OPENAI_MODEL
        value: gpt-5.6
