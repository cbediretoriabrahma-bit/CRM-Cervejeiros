{% extends "base.html" %}{% block content %}<h1>Equipe de Expansão</h1><div class="grid2"><section class="panel"><h2>Novo usuário</h2><form method="post" action="{{url_for('team_new')}}"><label>Nome<input name="name" required></label><label>E-mail<input type="email" name="email" required></label><label>Telefone<input name="phone"></label><label>Perfil<select name="role"><option value="seller">Vendedor</option><option value="manager">Gerente</option><option value="admin">Administrador</option></select></label><label>Senha inicial<input name="password" value="1234"></label><button class="btn primary">Cadastrar</button></form></section><section class="panel"><h2>Usuários</h2>{% for u in users %}<div class="lead-row"><b>{{u.name}}</b><span>{{u.role}}</span><em>{{u.email}}</em></div>{% endfor %}</section></div>{% endblock %}
