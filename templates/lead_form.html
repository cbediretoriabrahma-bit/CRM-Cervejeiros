{% extends "base.html" %}{% block content %}<h1>{{'Editar lead' if lead else 'Novo lead'}}</h1><form method="post" class="panel form-grid">
<label>Nome<input name="name" value="{{lead.name if lead else ''}}" required></label><label>WhatsApp<input name="phone" value="{{lead.phone if lead else ''}}" required></label><label>E-mail<input type="email" name="email" value="{{lead.email if lead else ''}}"></label><label>Cidade<input name="city" value="{{lead.city if lead else ''}}"></label><label>UF<input name="state" maxlength="2" value="{{lead.state if lead else ''}}"></label>
<label>Origem<select name="source">{% for x in sources %}<option {{'selected' if lead and lead.source==x}}>{{x}}</option>{% endfor %}</select></label><label>Investimento disponível<input name="investment" value="{{lead.investment if lead else ''}}"></label><label>Prazo<select name="timeframe">{% for x in timeframes %}<option {{'selected' if lead and lead.timeframe==x}}>{{x}}</option>{% endfor %}</select></label>
<label>Já é empreendedor?<select name="entrepreneur">{% for x in ['Sim','Talvez','Não','Não informado'] %}<option {{'selected' if lead and lead.entrepreneur==x}}>{{x}}</option>{% endfor %}</select></label><label>Aceita reunião?<select name="meeting_interest">{% for x in ['Sim','Talvez','Não','Não informado'] %}<option {{'selected' if lead and lead.meeting_interest==x}}>{{x}}</option>{% endfor %}</select></label>
<label>Modelo de interesse<select name="model_interest">{% for x in ['Starter - 1 geladeira','Pro - 2 geladeiras','Premium - 3 geladeiras','Ainda não definiu'] %}<option {{'selected' if lead and lead.model_interest==x}}>{{x}}</option>{% endfor %}</select></label>
{% if lead %}<label>Etapa<select name="stage">{% for x in pipeline %}<option {{'selected' if lead.stage==x}}>{{x}}</option>{% endfor %}</select></label>{% endif %}
{% if session.get('role') in ['admin','manager'] %}<label>Responsável<select name="owner_id"><option value="">Automático</option>{% for u in sellers %}<option value="{{u.id}}" {{'selected' if lead and lead.owner_id==u.id}}>{{u.name}}</option>{% endfor %}</select></label>{% endif %}
{% if lead %}<label>Valor fechado<input name="closed_value" value="{{lead.closed_value or ''}}"></label><label>Motivo da perda<input name="lost_reason" value="{{lead.lost_reason or ''}}"></label>{% endif %}
<label class="full">Observações<textarea name="notes" rows="5">{{lead.notes if lead else ''}}</textarea></label><div class="full"><button class="btn primary">Salvar e qualificar</button></div></form>{% endblock %}
